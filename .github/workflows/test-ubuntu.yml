name: Tests Ubuntu

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    # The suite includes tst_ui (registered in ctest as "ui" without an
    # ENVIRONMENT property); offscreen at job level makes every one of the
    # 16 CTest targets runnable on a runner with no display.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Same Qt as the Windows build job, so both platforms test the same
          # framework version rather than two different ones.
          version: '6.5.3'
          arch: linux_gcc_64
          modules: 'qthttpserver qtwebsockets'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # All 16 targets, including ui -- the hole this job exists to close:
      # the Windows workflow only built the desktop binary, so a red test
      # could sit on main indefinitely with a green check mark above it.
      - name: Test
        run: ctest --test-dir build --output-on-failure
