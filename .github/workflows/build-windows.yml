name: Build Windows (multi)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2022_64
          modules: 'qthttpserver'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target mahali-desktop
      - name: Deploy
        run: |
          mkdir dist
          copy build\apps\desktop\Release\mahali-desktop.exe dist\
          windeployqt --release dist\mahali-desktop.exe
      - run: Compress-Archive -Path dist\* -DestinationPath mahali-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mahali-msvc
          path: mahali-msvc.zip

  build-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_mingw
          modules: 'qthttpserver'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target mahali-desktop
      - name: Deploy
        run: |
          mkdir dist
          copy build\apps\desktop\mahali-desktop.exe dist\
          windeployqt --release dist\mahali-desktop.exe
      - run: Compress-Archive -Path dist\* -DestinationPath mahali-mingw65.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mahali-mingw65
          path: mahali-mingw65.zip
